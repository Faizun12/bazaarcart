<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazaarcart | Web View</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0f;
            color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: rgba(20, 20, 30, 0.9);
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn, .source-btn {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #6366f1;
        }
        .source-btn:hover {
            background: #ec4899;
        }
        .container {
            max-width: 800px;
            margin: 3rem auto;
            background: rgba(30, 30, 45, 0.5);
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .article-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 2rem;
            color: #6366f1;
        }
        .content p {
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: #a0a0b0;
            font-size: 1.1rem;
        }
        .error-msg {
            color: #ec4899;
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="back-btn">← Back to Search</a>
        <h1>Bazaar<span>cart</span> Web Viewer</h1>
        <a href="{{ original_url }}" target="_blank" class="source-btn">View Original Source</a>
    </header>

    <div class="container">
        {% if error %}
            <div class="error-msg">
                <h2>Oops!</h2>
                <p>{{ error }}</p>
                <p>Some websites block automated reading. Try clicking "View Original Source" above.</p>
            </div>
        {% else %}
            <h1 class="article-title">{{ title }}</h1>
            <div class="content">
                {% for p in content %}
                    <p>{{ p }}</p>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
