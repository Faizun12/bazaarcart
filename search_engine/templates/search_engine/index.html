<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazaarcart | Find It Once</title>
    <meta name="description" content="Unified product search across multiple online stores.">
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="app-container">
        <!-- Header / Hero Section -->
        <header id="main-header" class="hero-header">
            <div class="logo-container">
                <h1 class="logo-text">Bazaar<span>cart</span></h1>
                <p class="tagline">Search once. Find everywhere.</p>
            </div>
            
            <div class="search-container">
                <form id="search-form" class="search-form-container">
                    <div class="search-bar">
                        <input 
                            type="text" 
                            id="search-input" 
                            name="q" 
                            placeholder="What are you looking for today?" 
                            autocomplete="off" 
                            required
                        >
                        <button type="submit" id="search-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="advanced-filters">
                        <div class="filter-group">
                            <label for="min-price">Min Price ($)</label>
                            <input type="number" id="min-price" name="min_price" placeholder="0" min="0">
                        </div>
                        <div class="filter-group">
                            <label for="max-price">Max Price ($)</label>
                            <input type="number" id="max-price" name="max_price" placeholder="Any" min="0">
                        </div>
                        <div class="filter-group brand-group">
                            <label for="brand">Brand / Company</label>
                            <input type="text" id="brand" name="brand" placeholder="e.g. Apple, Samsung">
                        </div>
                    </div>
                </form>
            </div>
        </header>

        <!-- Results Section -->
        <main id="results-area" class="results-container hidden">
            <div class="results-header">
                <h2 id="results-title">Results</h2>
                <div class="results-meta" id="results-meta"></div>
            </div>
            
            <!-- Loading Skeleton -->
            <div id="loading-indicator" class="hidden">
                <div class="loader"></div>
                <p>Scouring the web for the best deals...</p>
            </div>

            <!-- Products Grid -->
            <div id="products-grid" class="products-grid">
                <!-- Dynamically populated by JS -->
            </div>
        </main>
    </div>

    <!-- Script -->
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
